# IssuePilot configuration for OctoAgent.
spec = "docs/spec.md"
conventions = "AGENTS.md"
check = "./scripts/check.sh"
base_branch = "main"
language = "zh"

[automation]
# Start planned work automatically and merge approved PRs automatically.
auto_merge = true
auto_ready = true
max_in_flight = 1
max_fix_rounds = 3
max_check_retries = 2
max_triaged_issues = 8

[agents]
planner = { cli = "codex", model = "" }
builder = { cli = "codex", model = "" }
reviewer = { cli = "codex", model = "" }
