name: check
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Run project checks
        run: |
          set -o pipefail
          if ./scripts/check.sh 2>&1 | tee "$RUNNER_TEMP/project-check.log"; then
            exit 0
          fi
          # Keep failing TAP cases visible to reviewers who receive only the log tail.
          echo "Failed test details:"
          awk '/^not ok / { failure = 1 } failure { print } /^  \.\.\./ { failure = 0 }' "$RUNNER_TEMP/project-check.log"
          exit 1
